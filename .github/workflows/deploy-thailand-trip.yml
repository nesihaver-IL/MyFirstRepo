name: Deploy HaVenture Thailand trip site to Pages

on:
  push:
    branches: ["claude/update-claude-md-BGuLn"]
    paths:
      - "01-personal/thailand-trip-2026/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload trip site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 01-personal/thailand-trip-2026
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
