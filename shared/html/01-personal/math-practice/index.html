<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תרגול מתמטיקה — כיתה ה׳</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>תרגול מתמטיקה — כיתה ה׳ 🧮</h1>
    <div id="score-bar">
      נכון: <span id="score-correct">0</span> &nbsp;|&nbsp; סה״כ: <span id="score-total">0</span>
    </div>
  </header>

  <!-- ── Module tabs ── -->
  <nav id="module-tabs" role="tablist">
    <button class="tab-btn active" data-module="numbers"  role="tab">מספרים טבעיים</button>
    <button class="tab-btn"        data-module="fractions" role="tab">שברים</button>
    <button class="tab-btn"        data-module="geometry"  role="tab">גאומטריה</button>
  </nav>

  <!-- ── Sub-topic selector ── -->
  <section id="subtopic-bar">

    <!-- Numbers sub-topics -->
    <div class="subtopic-group" data-module="numbers">
      <button class="sub-btn active" data-topic="fourOps">ארבע פעולות</button>
      <button class="sub-btn"        data-topic="equations">משוואות עם נעלם □</button>
      <button class="sub-btn"        data-topic="orderOfOps">סדר פעולות</button>
      <button class="sub-btn"        data-topic="inequalities">אי-שיוויונים</button>
    </div>

    <!-- Fractions sub-topics -->
    <div class="subtopic-group hidden" data-module="fractions">
      <button class="sub-btn active" data-topic="fracOfQty">שבר כחלק מכמות</button>
      <button class="sub-btn"        data-topic="findWhole">מציאת הכמות השלמה</button>
      <button class="sub-btn"        data-topic="fracAddSub">חיבור וחיסור שברים</button>
      <button class="sub-btn"        data-topic="mixedNumbers">מספרים מעורבים</button>
    </div>

    <!-- Geometry sub-topics -->
    <div class="subtopic-group hidden" data-module="geometry">
      <button class="sub-btn active" data-topic="triangleType">סוג משולש לפי זוויות</button>
      <button class="sub-btn"        data-topic="rectArea">שטח מלבן</button>
      <button class="sub-btn"        data-topic="triArea">שטח משולש</button>
    </div>

  </section>

  <!-- ── Problem area ── -->
  <main id="problem-area">

    <div id="problem-display">
      <!-- Rendered by JS -->
    </div>

    <!-- Numeric answer (most topics) -->
    <div id="input-area" class="answer-zone">
      <input
        type="text"
        id="answer-input"
        inputmode="decimal"
        autocomplete="off"
        placeholder="תשובה..."
        aria-label="תשובה"
      />
      <button id="submit-btn">בדוק ✓</button>
    </div>

    <!-- Multiple-choice answer (inequalities, triangle type) -->
    <div id="choice-area" class="answer-zone hidden">
      <!-- Buttons injected by JS -->
    </div>

    <!-- Feedback -->
    <div id="feedback" aria-live="polite"></div>

  </main>

  <!-- ── Controls ── -->
  <footer id="controls">
    <button id="next-btn" class="hidden">שאלה הבאה ←</button>
    <button id="reset-btn">אפס ניקוד</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
