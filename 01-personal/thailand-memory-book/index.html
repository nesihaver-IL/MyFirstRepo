<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thailand, 2026</title>
<meta name="description" content="Three weeks across Phuket, Krabi, and Khao Lak.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B4%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="hero-eyebrow" id="heroDates"></p>
    <h1 class="hero-title">Thailand, 2026</h1>
    <p class="hero-statement" id="heroStatement"></p>
    <p class="hero-route" id="heroRoute"></p>
  </div>
</header>

<div class="wrap">
  <nav class="view-toggle">
    <button type="button" data-view="timeline" class="is-active">Timeline</button>
    <button type="button" data-view="locations">By Location</button>
  </nav>

  <section class="view is-active" id="timelineView"></section>

  <section class="view" id="locationsView">
    <div class="location-filter" id="locationFilter"></div>
    <div id="locationsContent"></div>
  </section>
</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <div id="lightboxContent"></div>
</div>

<footer>
  <div class="wrap">Nineteen days, four stops, more photos than we could choose from.</div>
</footer>

<script src="app.js"></script>
</body>
</html>
