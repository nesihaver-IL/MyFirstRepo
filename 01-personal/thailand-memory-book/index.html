<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HaVenture</title>
<meta name="description" content="The Haver family's Thailand trip, in photos and video.">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; frame-src https://open.spotify.com; connect-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="lang-toggle" id="langToggle">
  <button type="button" data-lang="en" class="is-active">EN</button>
  <button type="button" data-lang="he">HE</button>
</nav>

<header class="hero">
  <div class="wrap">
    <p class="hero-eyebrow" id="heroDates"></p>
    <h1 class="hero-title">HaVenture</h1>
    <p class="hero-subtitle" id="heroSubtitle"></p>
    <p class="hero-statement" id="heroStatement"></p>
    <div class="stat-strip" id="statStrip"></div>
  </div>
</header>

<div class="wrap soundtrack">
  <p class="soundtrack-label" data-i18n="soundtrack">Our trip soundtrack</p>
  <iframe class="soundtrack-embed"
    src="https://open.spotify.com/embed/track/2DmZ7aPhT5jkqLIYxTpQlJ?utm_source=generator"
    width="100%" height="152" frameborder="0"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy"></iframe>
</div>

<div class="wrap">
  <nav class="view-toggle">
    <button type="button" data-view="timeline" class="is-active" data-i18n="timeline">Timeline</button>
    <button type="button" data-view="locations" data-i18n="route">The Route</button>
  </nav>

  <section class="view is-active" id="timelineView"></section>

  <section class="view" id="locationsView">
    <div class="location-filter" id="locationFilter"></div>
    <div id="locationsContent"></div>
  </section>
</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <div id="lightboxContent"></div>
</div>

<footer>
  <div class="wrap" id="footerText" data-i18n="footer">Nineteen days, four stops, more photos than we could choose from.</div>
</footer>

<script src="app.js"></script>
</body>
</html>
