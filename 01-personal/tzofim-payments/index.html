<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>היסטוריית תשלומים — הצופים</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      direction: rtl;
    }

    header {
      background: linear-gradient(135deg, #1e4d8c 0%, #2d7dd2 100%);
      color: white;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header .logo {
      font-size: 2.4rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    header p {
      font-size: 0.9rem;
      opacity: 0.85;
      margin-top: 4px;
    }

    .container {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 16px;
    }

    /* Summary cards */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card .label {
      font-size: 0.82rem;
      color: #718096;
      margin-bottom: 6px;
    }

    .card .value {
      font-size: 1.7rem;
      font-weight: 700;
      color: #1e4d8c;
    }

    .card .value.green { color: #276749; }
    .card .value.orange { color: #c05621; }

    /* Filters */
    .filters {
      background: white;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .filters label {
      font-size: 0.88rem;
      color: #4a5568;
      font-weight: 600;
    }

    .filters select, .filters input {
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.9rem;
      background: white;
      color: #2d3748;
      cursor: pointer;
    }

    /* Table */
    .table-wrap {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #ebf4ff;
    }

    thead th {
      padding: 14px 16px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #2c5282;
      text-align: right;
      border-bottom: 2px solid #bee3f8;
    }

    tbody tr {
      border-bottom: 1px solid #edf2f7;
      transition: background 0.15s;
    }

    tbody tr:hover {
      background: #f7faff;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody td {
      padding: 13px 16px;
      font-size: 0.92rem;
      color: #2d3748;
      vertical-align: middle;
    }

    .badge {
      display: inline-block;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge-paid   { background: #c6f6d5; color: #22543d; }
    .badge-pending { background: #fefcbf; color: #744210; }

    .amount {
      font-weight: 700;
      font-size: 1rem;
    }

    .total-row td {
      background: #ebf8ff;
      font-weight: 700;
      color: #2c5282;
      border-top: 2px solid #bee3f8;
      font-size: 0.97rem;
    }

    /* Footer note */
    .note {
      margin-top: 18px;
      font-size: 0.82rem;
      color: #718096;
      text-align: center;
    }

    @media (max-width: 600px) {
      .summary-row { grid-template-columns: 1fr; }
      thead th:nth-child(3), tbody td:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">⚜️</div>
  <div>
    <h1>היסטוריית תשלומים — הצופים</h1>
    <p>nesihaver@gmail.com &nbsp;|&nbsp; ספטמבר 2025 – מרץ 2026</p>
  </div>
</header>

<div class="container">

  <!-- Summary -->
  <div class="summary-row">
    <div class="card">
      <div class="label">סך תשלומים</div>
      <div class="value" id="total-count">—</div>
    </div>
    <div class="card">
      <div class="label">סכום ששולם</div>
      <div class="value green" id="total-paid">—</div>
    </div>
    <div class="card">
      <div class="label">ממתין לתשלום</div>
      <div class="value orange" id="total-pending">—</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <label for="filter-month">חודש:</label>
    <select id="filter-month">
      <option value="all">הכל</option>
      <option value="2025-09">ספטמבר 2025</option>
      <option value="2025-10">אוקטובר 2025</option>
      <option value="2025-11">נובמבר 2025</option>
      <option value="2025-12">דצמבר 2025</option>
      <option value="2026-01">ינואר 2026</option>
      <option value="2026-02">פברואר 2026</option>
      <option value="2026-03">מרץ 2026</option>
    </select>

    <label for="filter-status">סטטוס:</label>
    <select id="filter-status">
      <option value="all">הכל</option>
      <option value="paid">שולם</option>
      <option value="pending">ממתין</option>
    </select>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>תאריך</th>
          <th>תיאור</th>
          <th>קטגוריה</th>
          <th>סכום (₪)</th>
          <th>סטטוס</th>
        </tr>
      </thead>
      <tbody id="payments-body">
        <!-- Filled by JS -->
      </tbody>
      <tfoot>
        <tr class="total-row" id="total-footer">
          <td colspan="3">סה״כ מוצג</td>
          <td id="footer-sum">—</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <p class="note">הנתונים מוצגים לתקופה ספטמבר 2025 – מרץ 2026. לפרטים נוספים פנה/י לרכז השבט.</p>

</div>

<script>
  const MONTHS_HE = {
    '2025-09': 'ספטמבר 2025',
    '2025-10': 'אוקטובר 2025',
    '2025-11': 'נובמבר 2025',
    '2025-12': 'דצמבר 2025',
    '2026-01': 'ינואר 2026',
    '2026-02': 'פברואר 2026',
    '2026-03': 'מרץ 2026',
  };

  // Payment records for nesihaver@gmail.com — Tzofim, Sep 2025 – Mar 2026
  const payments = [
    { date: '2025-09-05', desc: 'דמי חבר — ספטמבר',      category: 'דמי חבר',   amount: 180, status: 'paid' },
    { date: '2025-09-10', desc: 'ציוד פעילות — תחילת שנה', category: 'ציוד',       amount: 250, status: 'paid' },
    { date: '2025-10-03', desc: 'דמי חבר — אוקטובר',      category: 'דמי חבר',   amount: 180, status: 'paid' },
    { date: '2025-10-20', desc: 'אוהל שנתי — סוכות',      category: 'פעילות',    amount: 320, status: 'paid' },
    { date: '2025-11-04', desc: 'דמי חבר — נובמבר',       category: 'דמי חבר',   amount: 180, status: 'paid' },
    { date: '2025-11-15', desc: 'סיור מדבר — נגב',        category: 'טיול',      amount: 420, status: 'paid' },
    { date: '2025-12-03', desc: 'דמי חבר — דצמבר',        category: 'דמי חבר',   amount: 180, status: 'paid' },
    { date: '2025-12-20', desc: 'ערב חנוכה — פעילות שבט', category: 'פעילות',    amount:  90, status: 'paid' },
    { date: '2026-01-05', desc: 'דמי חבר — ינואר',        category: 'דמי חבר',   amount: 180, status: 'paid' },
    { date: '2026-01-18', desc: 'סדנת מנהיגות',           category: 'הכשרה',     amount: 150, status: 'paid' },
    { date: '2026-02-03', desc: 'דמי חבר — פברואר',       category: 'דמי חבר',   amount: 180, status: 'paid' },
    { date: '2026-02-14', desc: 'מחנה חורף',               category: 'מחנה',      amount: 580, status: 'paid' },
    { date: '2026-03-04', desc: 'דמי חבר — מרץ',          category: 'דמי חבר',   amount: 180, status: 'pending' },
    { date: '2026-03-15', desc: 'מצעד פורים — עלות תחפושת', category: 'פעילות',  amount: 110, status: 'pending' },
  ];

  function monthKey(dateStr) {
    return dateStr.slice(0, 7); // "YYYY-MM"
  }

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-');
    return `${d}.${m}.${y}`;
  }

  function formatAmount(n) {
    return n.toLocaleString('he-IL') + ' ₪';
  }

  function render() {
    const filterMonth  = document.getElementById('filter-month').value;
    const filterStatus = document.getElementById('filter-status').value;

    const filtered = payments.filter(p => {
      const matchMonth  = filterMonth  === 'all' || monthKey(p.date) === filterMonth;
      const matchStatus = filterStatus === 'all' || p.status === filterStatus;
      return matchMonth && matchStatus;
    });

    const tbody = document.getElementById('payments-body');
    tbody.innerHTML = '';

    if (filtered.length === 0) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="5" style="text-align:center;padding:24px;color:#718096;">לא נמצאו תשלומים התואמים את הסינון.</td>';
      tbody.appendChild(tr);
      document.getElementById('footer-sum').textContent = '0 ₪';
      return;
    }

    let sum = 0;
    filtered.forEach(p => {
      sum += p.amount;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${formatDate(p.date)}</td>
        <td>${p.desc}</td>
        <td>${p.category}</td>
        <td class="amount">${formatAmount(p.amount)}</td>
        <td><span class="badge badge-${p.status}">${p.status === 'paid' ? 'שולם ✓' : 'ממתין'}</span></td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('footer-sum').textContent = formatAmount(sum);
  }

  function updateSummary() {
    const allInRange = payments; // already filtered to Sep25–Mar26
    const totalPaid    = allInRange.filter(p => p.status === 'paid').reduce((s, p) => s + p.amount, 0);
    const totalPending = allInRange.filter(p => p.status === 'pending').reduce((s, p) => s + p.amount, 0);

    document.getElementById('total-count').textContent   = allInRange.length;
    document.getElementById('total-paid').textContent    = formatAmount(totalPaid);
    document.getElementById('total-pending').textContent = formatAmount(totalPending);
  }

  document.getElementById('filter-month').addEventListener('change',  render);
  document.getElementById('filter-status').addEventListener('change', render);

  updateSummary();
  render();
</script>

</body>
</html>
